services:
  mysql:
    image: mysql:8.0
    command: --sort_buffer_size=8M --max_allowed_packet=64M
    environment:
      MYSQL_ROOT_PASSWORD: fixture_root_password
      MYSQL_DATABASE: survey_app
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pfixture_root_password"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: node:20-alpine
    command: sh -c "sleep infinity"
    volumes:
      - minio-data:/data

  app-backend:
    image: node:20-alpine
    working_dir: /app
    command: node server.js
    environment:
      PORT: "3210"
    ports:
      - "127.0.0.1:${FIXTURE_BACKEND_PORT:-32100}:3210"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
      - backend-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  app-frontend:
    image: node:20-alpine
    working_dir: /app
    command: node server.js
    ports:
      - "127.0.0.1:${FIXTURE_FRONTEND_PORT:-35174}:5174"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - app-backend

volumes:
  mysql-data:
  minio-data:
  backend-node-modules:
  frontend-node-modules:
  backend-uploads:
